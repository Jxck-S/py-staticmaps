name: Docs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# one deployment at a time, and never cancel one halfway
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cairo and the headless GL stack
        # pymgl renders the vector examples through OpenGL. There is no GPU
        # here, so Mesa's llvmpipe does it in software, which needs a display
        # for the GL stack to attach to.
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libegl1 libgl1-mesa-dri xvfb ca-certificates
          # pymgl's manylinux wheels are built on a RedHat base, so their
          # bundled curl looks for the CA bundle where RedHat keeps it and
          # ignores CURL_CA_BUNDLE. See brendan-ward/pymgl#23.
          sudo mkdir -p /etc/pki/tls/certs
          sudo ln -sf /etc/ssl/certs/ca-certificates.crt /etc/pki/tls/certs/ca-bundle.crt
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-cairo.txt
          pip install -r requirements-examples.txt
          pip install -r requirements-docs.txt
          pip install -r requirements-pymgl.txt
      - name: Render the examples
        # examples needing a key or an optional dependency skip themselves,
        # so a missing secret costs a picture rather than the build
        env:
          API_KEY_CARTO: ${{ secrets.API_KEY_CARTO }}
          API_KEY_JAWG: ${{ secrets.API_KEY_JAWG }}
          API_KEY_STADIA: ${{ secrets.API_KEY_STADIA }}
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          xvfb-run -a --server-args="-screen 0 1024x768x24 -ac +render -noreset" \
            env PYTHONPATH=. python examples/run_examples.py
      - name: Build the site
        run: python -m mkdocs build --clean --strict
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    # only main publishes; a pull request builds to prove it still builds
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
